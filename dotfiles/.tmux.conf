# ─── Prefix ───────────────────────────────────────────────
# Remap prefix from Ctrl-b to Ctrl-a (much easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1              # Windows start at 1, not 0
setw -g pane-base-index 1        # Panes too
set -g renumber-windows on       # Re-number when closing a window
set -g escape-time 0             # No delay after pressing Escape (critical for nvim)
set -g history-limit 50000
set -g focus-events on           # Let nvim detect focus changes

# ─── Splits ───────────────────────────────────────────────
# Intuitive split keys (and open in the same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also open in the same directory
bind c new-window -c "#{pane_current_path}"

# ─── Vim-style pane navigation ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resizing (prefix + H/J/K/L) ────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Session switching ────────────────────────────────────
# Quick session picker (the key workflow for jumping between projects)
bind s choose-tree -sZ

# ─── Window switching ────────────────────────────────────
bind -r n next-window
bind -r p previous-window

# ─── Copy mode (vi keys) ─────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ─── Reload config ────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Status bar ───────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#888888"

set -g status-left-length 30
set -g status-left "#[fg=#c0c0c0,bold] #S #[fg=#555555]│ "

set -g status-right-length 40
set -g status-right "#[fg=#555555]│ #[fg=#888888]%H:%M "

# Window tabs in the status bar
setw -g window-status-format "#[fg=#555555] #I:#W "
setw -g window-status-current-format "#[fg=#c0c0c0,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#888888"

# ─── TPM (plugin manager) ────────────────────────────────
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I to install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
